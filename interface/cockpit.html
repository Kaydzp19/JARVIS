<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Cockpit</title>
<style>
  :root {
    --fond: #000;
    --panneau: #05080d;
    --bleu: #3aa0ff;
    --bleu-pale: #8cc8ff;
    --blanc: #e8f3ff;
    --gris: #6b7c90;
    --trait: #14304d;
    --alerte: #ff9f43;
    --ok: #5ee0a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--blanc);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--trait); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .3em; color: var(--bleu); font-weight: 600; }
  header .info { color: var(--gris); font-size: 12px; }
  header .info b { color: var(--bleu-pale); font-weight: 500; }
  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(340px, 1fr);
    height: calc(100% - 46px); }
  #cerveau { position: relative; border-right: 1px solid var(--trait); min-height: 300px; }
  #cerveau canvas { display: block; }
  #cerveau .legende { position: absolute; left: 12px; right: 12px; bottom: 10px; color: var(--gris);
    font-size: 11px; pointer-events: none; }
  #cerveau .secours { padding: 24px; color: var(--gris); }
  #panneaux { overflow-y: auto; padding: 12px 14px 40px; }
  section { border: 1px solid var(--trait); background: var(--panneau); margin-bottom: 12px;
    padding: 10px 12px; }
  section h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .25em; color: var(--bleu);
    font-weight: 600; text-transform: uppercase; }
  .ligne { padding: 6px 0; border-top: 1px solid #0c1a2a; }
  .ligne:first-of-type { border-top: 0; }
  .petit { color: var(--gris); font-size: 11px; }
  .champ { display: grid; grid-template-columns: 84px 1fr; gap: 6px; margin: 2px 0; }
  .champ > span:first-child { color: var(--bleu-pale); }
  ol { margin: 4px 0 4px 18px; padding: 0; }
  button { font: inherit; background: transparent; color: var(--blanc);
    border: 1px solid var(--bleu); padding: 4px 10px; cursor: pointer; margin: 4px 6px 0 0; }
  button:hover { background: #0d2238; }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.non { border-color: var(--alerte); color: var(--alerte); }
  a, .lien { color: var(--bleu-pale); cursor: pointer; text-decoration: underline;
    text-decoration-color: var(--trait); }
  input, textarea, select { font: inherit; background: #000; color: var(--blanc);
    border: 1px solid var(--trait); padding: 5px 7px; width: 100%; }
  textarea { min-height: 150px; resize: vertical; }
  pre { white-space: pre-wrap; margin: 4px 0; color: #b9d4ee; max-height: 160px; overflow: auto; }
  .badge { display: inline-block; border: 1px solid var(--trait); padding: 0 6px;
    font-size: 11px; color: var(--gris); margin-right: 4px; }
  .badge.alerte { color: var(--alerte); border-color: var(--alerte); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .rangee { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .rangee > * { flex: 1; }
  .rangee > button { flex: 0 0 auto; margin-top: 0; }
  #message { position: fixed; right: 16px; bottom: 16px; background: #0d2238;
    border: 1px solid var(--bleu); padding: 8px 12px; display: none; max-width: 80vw; }
  @media (max-width: 860px) {
    main { display: block; height: auto; }
    #cerveau { height: 45vh; border-right: 0; border-bottom: 1px solid var(--trait); }
    #panneaux { overflow: visible; padding: 10px 16px 40px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S.</h1>
  <span class="info" id="resume">chargement…</span>
  <span class="info" id="budget"></span>
</header>
<main>
  <div id="cerveau"><div class="legende">neurones = notes · synapses = liens (épaisseur = poids) · une région par projet · glisser pour tourner, clic sur un neurone pour l'ouvrir</div></div>
  <div id="panneaux">
    <section id="p-maintenant"><h2>Maintenant</h2><div class="corps"></div></section>
    <section id="p-propositions"><h2>Propositions · garde d'écriture</h2><div class="corps"></div></section>
    <section id="p-editeur"><h2>Éditeur de notes</h2><div class="corps"></div></section>
    <section id="p-taches"><h2>Tâches (tous projets)</h2><div class="corps"></div></section>
    <section id="p-agents"><h2>Agents</h2><div class="corps"></div></section>
    <section id="p-journal"><h2>Journal</h2><div class="corps"></div></section>
  </div>
</main>
<div id="message"></div>

<script type="module">
// ---------- outils ----------
function el(tag, attrs = {}, ...enfants) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const e of enfants.flat()) if (e != null) n.append(e.nodeType ? e : document.createTextNode(String(e)));
  return n;
}
function corps(id) { const c = document.querySelector(`#${id} .corps`); c.replaceChildren(); return c; }
function message(texte) {
  const m = document.getElementById("message");
  m.textContent = texte; m.style.display = "block";
  clearTimeout(message.t); message.t = setTimeout(() => (m.style.display = "none"), 3500);
}
async function api(chemin, donnees) {
  const opts = donnees === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(donnees) };
  const r = await fetch(chemin, { credentials: "same-origin", ...opts });
  const j = await r.json();
  if (!r.ok) throw new Error(j.erreur || r.status);
  return j;
}
async function action(fn, ok) {
  try { await fn(); if (ok) message(ok); await rafraichir(); }
  catch (e) { message("Erreur : " + e.message); }
}

// ---------- panneaux ----------
let ETAT = null;
const editeur = { projet: null, note: null };

function afficherMaintenant(c) {
  const b = corps("p-maintenant");
  if (!c) {
    b.append(el("div", { class: "petit" }, "Rien à faire pour l'instant. Ajoute une tâche ou lance un tour de l'orchestrateur."),
      el("button", { onclick: () => action(() => api("/api/tour", {}), "Tour terminé.") }, "Lancer un tour"));
    return;
  }
  const champ = (nom, ...val) => el("div", { class: "champ" }, el("span", {}, nom), el("span", {}, ...val));
  b.append(
    champ("QUOI", c.quoi, " ", el("span", { class: "badge" }, c.projet)),
    champ("POURQUOI", c.pourquoi),
    c.ou ? champ("OÙ", el("span", { class: "lien", onclick: () => ouvrirNote(c.projet, c.ou.note_id) }, c.ou.titre)) : null,
    champ("COMMENT", el("div", {}, `${c.duree_totale_min} min au total`,
      el("ol", {}, c.comment.map(e => el("li", {}, `${e.etape} (${e.duree_min} min)`)))) ),
    champ("FIN", el("span", {},
      el("button", { class: "ok", onclick: () => action(() => api("/api/tache", { projet: c.projet, id: c.tache_id, fait: true }), "Bravo. " + c.apres) }, "Fait"),
      el("button", { class: "non", onclick: () => action(() => api("/api/tache", { projet: c.projet, id: c.tache_id, fait: false }), "Noté. On y reviendra.") }, "Pas fait"))),
    champ("APRÈS", c.apres));
}

function afficherPropositions(liste) {
  const b = corps("p-propositions");
  if (!liste.length) { b.append(el("div", { class: "petit" }, "Aucune proposition en attente.")); return; }
  for (const p of liste) {
    const v = p.verification;
    const badge = !v ? el("span", { class: "badge" }, "non vérifiée")
      : v.ok ? el("span", { class: "badge ok" }, "vérifiée")
      : el("span", { class: "badge alerte" }, "à corriger : " + v.problemes.join(" ; "));
    b.append(el("div", { class: "ligne" },
      el("div", {}, el("span", { class: "badge" }, p.projet), el("span", { class: "badge" }, p.type), " ", p.titre),
      el("div", { class: "petit" }, `par ${p.acteur} · ${p.creee_le}`, p.raison ? ` · ${p.raison}` : ""),
      badge, el("pre", {}, p.contenu),
      el("button", { class: "ok", onclick: () => action(() => api("/api/proposition", { projet: p.projet, id: p.id, action: "valider" }), "Validée et écrite.") }, "Valider"),
      el("button", { class: "non", onclick: () => action(() => api("/api/proposition", { projet: p.projet, id: p.id, action: "refuser" }), "Refusée. Rien n'a été écrit.") }, "Refuser")));
  }
}

function afficherTaches(liste, projetsInfo) {
  const b = corps("p-taches");
  const titre = el("input", { placeholder: "Nouvelle tâche…" });
  const ech = el("input", { type: "date" });
  const sel = el("select", {}, projetsInfo.map(p => el("option", { value: p.nom }, p.nom)));
  b.append(el("div", { class: "rangee" }, titre),
    el("div", { class: "rangee" }, sel, ech, el("button", { onclick: () => {
      if (!titre.value.trim()) return message("Écris d'abord le titre de la tâche.");
      action(async () => { await api("/api/tache/nouvelle", { projet: sel.value, titre: titre.value, echeance: ech.value });
        await api("/api/tour", {}); }, "Tâche ajoutée et planifiée.");
    } }, "Ajouter")));
  for (const t of liste.filter(t => t.statut !== "fait").slice(0, 30))
    b.append(el("div", { class: "ligne" }, el("span", { class: "badge" }, t.projet), t.titre,
      el("span", { class: "petit" }, ` · ${t.statut}`, t.echeance ? ` · échéance ${t.echeance}` : "", t.planifiee ? "" : " · pas encore planifiée")));
}

function afficherAgents(agents, modules) {
  const b = corps("p-agents");
  for (const a of agents)
    b.append(el("div", { class: "ligne" }, el("b", {}, a.nom), el("span", { class: "petit" }, ` · voie ${a.voie} · ${a.actions} action(s)`),
      el("div", { class: "petit" }, a.consigne), el("div", { class: "petit" }, "outils : " + a.outils.join(", "))));
  for (const m of modules)
    b.append(el("div", { class: "ligne" }, el("span", { class: "badge" }, "module"), m.nom,
      el("span", { class: "petit" }, m.actif ? ` · actif (${m.mode})` : " · inactif")));
}

function afficherJournal(lignes) {
  const b = corps("p-journal");
  for (const l of lignes.slice(0, 40))
    b.append(el("div", { class: "ligne" }, el("span", { class: "petit" }, `${l.date.slice(0, 16).replace("T", " ")} · ${l.projet} · ${l.acteur}`),
      el("div", {}, l.evenement), l.raison ? el("div", { class: "petit" }, "raison : " + l.raison) : null));
}

// ---------- éditeur ----------
async function afficherEditeur() {
  const b = corps("p-editeur");
  const projetsInfo = ETAT.projets;
  if (!editeur.projet && projetsInfo.length) editeur.projet = projetsInfo[0].nom;
  const sel = el("select", { onchange: e => { editeur.projet = e.target.value; editeur.note = null; afficherEditeur(); } },
    projetsInfo.map(p => { const o = el("option", { value: p.nom }, p.nom + (p.sensible ? " (sensible)" : "")); if (p.nom === editeur.projet) o.selected = true; return o; }));
  const nouveau = el("input", { placeholder: "Nom d'un nouveau projet" });
  b.append(el("div", { class: "rangee" }, sel),
    el("div", { class: "rangee" }, nouveau, el("button", { onclick: () => {
      if (!nouveau.value.trim()) return message("Écris d'abord le nom du projet.");
      editeur.projet = nouveau.value.trim();
      action(() => api("/api/projet", { nom: nouveau.value }), "Projet créé.");
    } }, "Créer")));
  if (!editeur.projet) return;

  const notes = await api(`/api/notes?projet=${encodeURIComponent(editeur.projet)}`);
  b.append(el("div", { class: "petit" }, "Notes : ",
    ...notes.map(n => el("span", {}, el("span", { class: "lien", onclick: () => ouvrirNote(editeur.projet, n.id) }, n.titre), " · ")),
    el("span", { class: "lien", onclick: () => { editeur.note = null; afficherEditeur(); } }, "+ nouvelle note")));

  const n = editeur.note;
  const titre = el("input", { placeholder: "Titre de la note" });
  const texte = el("textarea", { placeholder: "Écris ici. Pour relier une autre note : [[Titre de la note]]" });
  const sensible = el("input", { type: "checkbox", style: "width:auto" });
  if (n) { titre.value = n.titre; titre.disabled = true; texte.value = n.contenu; }
  b.append(el("div", { class: "rangee" }, titre), texte,
    n ? null : el("label", { class: "petit" }, sensible, " note sensible (ne part jamais vers une IA en ligne)"),
    el("div", {}, el("button", { onclick: () => {
      if (!n && !titre.value.trim()) return message("Donne un titre à la note.");
      action(async () => {
        const r = await api("/api/note", { projet: editeur.projet, id: n ? n.id : null, titre: titre.value, contenu: texte.value, sensible: sensible.checked });
        editeur.note = await api(`/api/note?projet=${encodeURIComponent(editeur.projet)}&id=${r.id}`);
      }, "Note enregistrée.");
    } }, n ? "Enregistrer" : "Créer la note")));
  if (n) {
    const lienVers = x => x.id ? el("span", { class: "lien", onclick: () => ouvrirNote(editeur.projet, x.id) }, x.titre) : el("span", { class: "petit" }, x.titre + " (n'existe pas encore)");
    b.append(el("div", { class: "petit" }, "Liens : ", ...(n.liens.length ? n.liens.map(x => el("span", {}, lienVers(x), " ")) : ["aucun"])),
      el("div", { class: "petit" }, "Rétroliens : ", ...(n.retroliens.length ? n.retroliens.map(x => el("span", {}, lienVers(x), " ")) : ["aucun"])));
  }
}

async function ouvrirNote(projet, id) {
  editeur.projet = projet;
  editeur.note = await api(`/api/note?projet=${encodeURIComponent(projet)}&id=${id}`);
  await afficherEditeur();
  document.getElementById("p-editeur").scrollIntoView({ behavior: "smooth" });
}

// ---------- cerveau 3D ----------
const cerveau = { pret: false };

function hasard(graine) {           // nombre pseudo-aléatoire stable (même dessin à chaque fois)
  let h = 2166136261;
  for (const c of graine) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}

function disposer(projet, centre) {  // petite simulation de ressorts pour placer les neurones
  const r = hasard(projet.nom);
  const pos = new Map(projet.notes.map(n => [n.id, [centre[0] + (r() - .5) * 6, centre[1] + (r() - .5) * 6, centre[2] + (r() - .5) * 6]]));
  const ids = [...pos.keys()];
  for (let it = 0; it < 250; it++) {
    const f = new Map(ids.map(i => [i, [0, 0, 0]]));
    for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) {
      const pa = pos.get(ids[a]), pb = pos.get(ids[b]);
      const d = [pa[0] - pb[0], pa[1] - pb[1], pa[2] - pb[2]];
      const l2 = Math.max(d[0] ** 2 + d[1] ** 2 + d[2] ** 2, .01), k = 4 / l2;
      for (let x = 0; x < 3; x++) { f.get(ids[a])[x] += d[x] * k; f.get(ids[b])[x] -= d[x] * k; }
    }
    for (const s of projet.liens) {
      const pa = pos.get(s.source), pb = pos.get(s.cible); if (!pa || !pb) continue;
      for (let x = 0; x < 3; x++) { const d = (pb[x] - pa[x]) * (.04 + s.poids * .1); f.get(s.source)[x] += d; f.get(s.cible)[x] -= d; }
    }
    for (const i of ids) { const p = pos.get(i), g = f.get(i);
      for (let x = 0; x < 3; x++) p[x] += Math.max(-.5, Math.min(.5, g[x] + (centre[x] - p[x]) * .02)); }
  }
  // Toute la région est mise à l'échelle pour tenir dans sa sphère (sans déformer le dessin).
  const loin = Math.max(.01, ...[...pos.values()].map(p => Math.hypot(p[0] - centre[0], p[1] - centre[1], p[2] - centre[2])));
  if (loin > 4.8) for (const p of pos.values()) for (let x = 0; x < 3; x++) p[x] = centre[x] + (p[x] - centre[x]) * 4.8 / loin;
  return pos;
}

async function initCerveau() {
  const zone = document.getElementById("cerveau");
  try {
    const THREE = await import("three");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const rendu = new THREE.WebGLRenderer({ antialias: true });
    rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
    zone.prepend(rendu.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(55, 1, .1, 500); camera.position.set(0, 8, 34);
    const ctrl = new OrbitControls(camera, rendu.domElement);
    ctrl.enableDamping = true; ctrl.autoRotate = true; ctrl.autoRotateSpeed = .6;
    scene.add(new THREE.AmbientLight(0xffffff, .7));
    const lum = new THREE.PointLight(0x8cc8ff, 40, 0); lum.position.set(10, 20, 20); scene.add(lum);
    const groupe = new THREE.Group(); scene.add(groupe);
    const taille = () => { const w = zone.clientWidth, h = zone.clientHeight; rendu.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
    addEventListener("resize", taille); taille();
    const ray = new THREE.Raycaster(), souris = new THREE.Vector2();
    let depart = null;
    rendu.domElement.addEventListener("pointerdown", e => depart = [e.clientX, e.clientY]);
    rendu.domElement.addEventListener("pointerup", e => {
      if (!depart || Math.hypot(e.clientX - depart[0], e.clientY - depart[1]) > 5) return;
      const b = rendu.domElement.getBoundingClientRect();
      souris.set(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
      ray.setFromCamera(souris, camera);
      const touche = ray.intersectObjects(groupe.children).find(i => i.object.userData.note);
      if (touche) { const u = touche.object.userData; ouvrirNote(u.projet, u.note); }
    });
    (function boucle() { requestAnimationFrame(boucle); ctrl.update(); rendu.render(scene, camera); })();
    Object.assign(cerveau, { THREE, groupe, camera, pret: true });
  } catch (e) {
    zone.append(el("div", { class: "secours" }, "Le cerveau 3D a besoin d'Internet pour charger Three.js (la bibliothèque 3D). Le reste du cockpit fonctionne normalement."));
  }
}

function etiquette(THREE, texte, couleur, taille = .9) {
  const c = document.createElement("canvas"), ctx = c.getContext("2d");
  ctx.font = "28px Menlo, monospace";
  c.width = Math.ceil(ctx.measureText(texte).width) + 16; c.height = 40;
  ctx.font = "28px Menlo, monospace"; ctx.fillStyle = couleur; ctx.fillText(texte, 8, 29);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  s.scale.set(c.width / c.height * taille, taille, 1);
  return s;
}

function dessinerCerveau(g) {
  if (!cerveau.pret) return;
  const { THREE, groupe } = cerveau;
  groupe.children.slice().forEach(o => { groupe.remove(o); o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose(); });
  const n = g.projets.length, R = n > 1 ? 9 + n * 2.5 : 0;
  cerveau.camera.position.setLength(Math.max(26, R * 1.9 + 16));
  g.projets.forEach((p, i) => {
    const a = (i / Math.max(n, 1)) * Math.PI * 2;
    const centre = [Math.cos(a) * R, 0, Math.sin(a) * R];
    const pos = disposer(p, centre);
    const nom = etiquette(THREE, p.nom, "#3aa0ff", 1.3);
    nom.position.set(centre[0], centre[1] + 6.5, centre[2]); groupe.add(nom);
    const halo = new THREE.Mesh(new THREE.SphereGeometry(5.8, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0x3aa0ff, wireframe: true, transparent: true, opacity: .05 }));
    halo.position.set(...centre); groupe.add(halo);
    for (const s of p.liens) {
      const A = pos.get(s.source), B = pos.get(s.cible); if (!A || !B) continue;
      const va = new THREE.Vector3(...A), vb = new THREE.Vector3(...B), long = va.distanceTo(vb);
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(.02 + s.poids * .22, .02 + s.poids * .22, long, 6),
        new THREE.MeshBasicMaterial({ color: 0x3aa0ff, transparent: true, opacity: .25 + s.poids * .7 }));
      tube.position.copy(va).add(vb).multiplyScalar(.5);
      tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
      groupe.add(tube);
    }
    for (const note of p.notes) {
      const P = pos.get(note.id);
      const boule = new THREE.Mesh(new THREE.SphereGeometry(note.validee ? .38 : .28, 16, 12),
        new THREE.MeshStandardMaterial({ color: note.validee ? 0xe8f3ff : 0x3a6ea0, emissive: note.validee ? 0x1d4f80 : 0x0a1a2a }));
      boule.position.set(...P); boule.userData = { projet: p.nom, note: note.id };
      groupe.add(boule);
      const t = etiquette(THREE, note.titre, "#cfe6ff", .55); t.position.set(P[0], P[1] + .75, P[2]); groupe.add(t);
    }
  });
}

// ---------- chargement ----------
async function rafraichir() {
  const [etat, g] = await Promise.all([api("/api/etat"), api("/api/graphe")]);
  ETAT = etat;
  const nbNotes = etat.projets.reduce((s, p) => s + p.notes, 0);
  document.getElementById("resume").replaceChildren("projets ", el("b", {}, etat.projets.length),
    " · notes ", el("b", {}, nbNotes), " · propositions ", el("b", {}, etat.propositions.length));
  document.getElementById("budget").replaceChildren("budget IA ", el("b", {}, `${etat.budget.depense.toFixed(2)} € / ${etat.budget.plafond} €`), " ce mois");
  afficherMaintenant(etat.maintenant);
  afficherPropositions(etat.propositions);
  afficherTaches(etat.taches, etat.projets);
  afficherAgents(etat.agents, etat.modules);
  afficherJournal(etat.journal);
  await afficherEditeur();
  dessinerCerveau(g);
}

await initCerveau();
rafraichir().catch(e => message("Erreur : " + e.message));
</script>
